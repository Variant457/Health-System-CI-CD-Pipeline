# Establishes the network connections for each Kubernetes Pod
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME:-health-app}
  labels:
    app: ${APP_NAME:-health-app}
spec:
  selector:
    app: ${APP_NAME:-health-app}
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP