# Establishes how Kubernetes Pods are created
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME:-health-app}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:    # Ensures Server is always up while an update is being deployed
      maxUnavaliable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ${APP_NAME:-health-app}
  template:
    metadata:
      labels:
        app: ${APP_NAME:-health-app}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:   # Marks when App is ready
            httpGet:
              path: /patients
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:    # Marks if server is healthy; restarts if fails
            httpGet:
              path: /patients
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}