name: Java Healthcare System Pipeline
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
          - uses: actions/cache@v4
            with:
                path: ~/.m2/repository
                key: ${{runner.os}}-m2-${{hashFiles('**/pom.xml')}}

          - name: Package Healthcare App
            run: mvn -B -DskipTests package -f app/pom.xml

          - name: Build Local Container Image
            run: docker build -t health-app:ci app/

          - name: Save .jar File
            uses: actions/upload-artifact@v4
            with:
                name: app-jar
                path: target/*.jar
    deploy-to-kind:
        name: Ephemeral Kubernetes Deployment
        runs-on: ubuntu-latest
        #needs: [e2e-tests]     ------TODO------
        env:
            APP_NAME: health-app
            NAMESPACE: demo
            IMAGE_REPO: health-app
            IMAGE_TAG: ci
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
          - uses: azure/setup-kubectl@v4
          - uses: azure/setup-helm@v4

          - name: Package App
            run: mvn -B -DskipTests package -f app/pom.xml

          - name: Build Deployment Container Image
            run: docker build -t $IMAGE_REPO:$IMAGE_TAG app/

          - name: Create Kubernetes Cluster
            uses: helm/kind-action@v1
            
          - name: Load Local Image to Deployment Cluster
            run: kind load docker-image $IMAGE_REPO:$IMAGE_TAG
        
          - name: Deploy Kubernetes Manifests
            run: |
                kubectl get ns $NAMESPACE || kubectl create ns $NAMESPACE
                export IMAGE="$IMAGE_REPO:$IMAGE_TAG"
                envsubst < k8s/deployment.yml > /tmp/deploy.yml
                envsubst < k8s/service.yml > /tmp/svc.yml
                kubectl apply -n $NAMESPACE -f /tmp/deploy.yml
                kubectl apply -n $NAMESPACE -f /tmp/svc.yml

          - name: Waiting for Cluster to Become Availiable
            run: |
                kubectl rollout status deploy/$APP_NAME -n $NAMESPACE --timeout=180s
                kubectl get all -n $NAMESPACE

          - name: Function Testing
            run: |
                kubectl -n $NAMESPACE port-forward deploy/$APP_NAME 8080:8080 >/tmp/pf.log 2>&1 &
                PF_PID=$!
                sleep 4
                echo "GET:" && curl -sf http://localhost:8080/patients
                echo "POST:" && curl -sf -H 'Content-Type: application/json' -d '"Eve"' http://localhost:8080/patients
                echo "VERIFY:" && curl -sf http://localhost:8080/patients | grep -q "Eve"
                kill $PF_PID || true

          - name: Dump Logs
            if: failure()
            run: |
                kubectl describe deploy/$APP_NAME -n $NAMESPACE || true
                kubectl get pods -n $NAMESPACE -o wide
                for p in $(kubectl get pods -n $NAMESPACE -o name); do
                    echo "------- $p -------"
                    kubectl logs -n $NAMESPACE $p || true
                done

          - name: Save Rendered Manifests
            uses: actions/upload-artifact@v4
            with:
                name: rendered-manifests
                path: /tmp/*.yml