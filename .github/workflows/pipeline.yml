name: Java Healthcare System Pipeline
permissions:
    contents: read
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
          - uses: actions/cache@v4
            with:
                path: ~/.m2/repository
                key: ${{runner.os}}-m2-${{hashFiles('**/pom.xml')}}

          - name: Debug Repo Tree
            run: |
                pwd
                ls -la
                find . -maxdepth 2 -type f -name "pom.xml" -o -name "Dockerfile" -o -name "*.yml" -o -name "*.yaml"

          - name: Package Healthcare App
            run: mvn -B -DskipTests package -f healthcare-info-system/pom.xml

          - name: Build Local Container Image
            run: docker build -t health-app:ci .

          - name: Save .jar File
            uses: actions/upload-artifact@v4
            with:
                name: app-jar
                path: target/*.jar
    unit-tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v3
          - uses: actions/setup-java@v3
            with:
                java-version: '17'
                distribution: 'temurin'
          - name: Run Unit Tests
            run: mvn test -Punit -f healthcare-info-system/pom.xml
          
    
    integration-tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v3
          - uses: actions/setup-java@v3
            with:
                java-version: '17'
                distribution: 'temurin'
          - name: Run Integration Tests
            run: mvn verify -Pintegration -f healthcare-info-system/pom.xml

    e2e-tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v3
          - uses: actions/setup-java@v3
            with:
                java-version: '17'
                distribution: 'temurin'
          - name: Start App in Background
            run: mvn spring-boot:run &
          - name: Run E2E Tests
            run: mvn verify -Pe2e -f healthcare-info-system/pom.xml

    security-test:
      runs-on: ubuntu-latest
      needs: build
      env:
        IMAGE_REPO: ghcr.io/Variant457/Health-System-CI-CD-Pipeline
        IMAGE_TAG: latest
      steps:
        - name: Login to GitHub Credentials
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}
        - name: Scan Image with Trivy
          uses: aquasecurity/trivy-action@0.24.0
          with:
            scan-type: image
            image-ref: ${{env.IMAGE_REPO}}:${{env.IMAGE_TAG}}
            format: 'table'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'HIGH,CRITICAL'
            exit-code: '1'
    
    deploy-to-kind:
        name: Ephemeral Kubernetes Deployment
        runs-on: ubuntu-latest
        needs: [unit-tests, integration-tests, e2e-tests, security-test]
        environment:
          name: ${{ startsWith(github.ref, 'refs/heads/main') && 'production' || 'staging' }}
        env:
            APP_NAME: health-app
            NAMESPACE: demo
            IMAGE_REPO: health-app
            IMAGE_TAG: ci
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
          - uses: azure/setup-kubectl@v4
          - uses: azure/setup-helm@v4
          - uses: helm/kind-action@v1
            with:
                wait: 120s

          - name: Package App
            run: mvn -B -DskipTests package -f healthcare-info-system/pom.xml

          - name: Build Deployment Container Image
            run: docker build -t $IMAGE_REPO:$IMAGE_TAG .
            
          - name: Load Local Image to Deployment Cluster
            run: kind load docker-image $IMAGE_REPO:$IMAGE_TAG --name chart-testing
        
          - name: Deploy Kubernetes Manifests
            run: |
                kubectl get ns $NAMESPACE || kubectl create ns $NAMESPACE
                export APP_NAME="${APP_NAME:-health-app}"
                export IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"
                envsubst < k8s/deployment.yml > /tmp/deploy.yml
                envsubst < k8s/service.yml > /tmp/svc.yml
                kubectl apply -n $NAMESPACE -f /tmp/deploy.yml
                kubectl apply -n $NAMESPACE -f /tmp/svc.yml

          - name: Health Checks & Rollback Upon Failure
            run: |
                # Waits for Rollout
                set -eo pipefail
                kubectl rollout status deploy/$APP_NAME -n $NAMESPACE --timeout=180s
                kubectl get all -n $NAMESPACE    

                # Forward service from port 80 to 8080
                kubectl -n $NAMESPACE port-forward svc/$APP_NAME 8080:80 >/tmp/pf.log 2>&1 &
                PF_PID=$!
                
                # Waits for Port to be Forwarded
                for i in {1..30}; do
                    if grep -q "Forwarding from 127.0.0.1:8080 ->" /tmp/pf.log; then
                        break
                    fi
                    sleep 1
                done
                echo "------ port-forward log ------"
                tail -n +1 /tmp/pf.log || true

                echo "------ readiness health ------"
                curl -sS -o /tmp/health.json -w "HTTP %{http_code}\n" http://127.0.0.1:8080/actuator/health/readiness
                cat /tmp/health.json; echo

                echo "------ GET /patients (status+body) ------"
                curl -sS -o /tmp/patients1.json -w "HTTP %{http_code}\n" http://127.0.0.1:8080/patients
                cat /tmp/patients1.json; echo

                echo "------ POST /patients \"Eve\" ------"
                curl -sS -i -H 'Content-Type: application/json' -d '"Eve"' http://127.0.0.1:8080/patients
                
                echo "------ GET /patients (verify Eve) ------"
                curl -sS -o /tmp/patients2.json -w "HTTP %{http_code}\n" http://127.0.0.1:8080/patients
                cat /tmp/patients2.json; echo
                grep -q "Eve" /tmp/patients2.json

                echo "------ Health Check ------"
                curl=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health/readiness || true)
                kill $PF_PID || true

                if ["$code" != 200 ]; then
                  echo "Health check failed with HTTP $code \n Rolling back..."
                  kubectl rollout undo deploy/$APP_NAME -n $NAMESPACE
                  kubectl rollout status deploy/$APP_NAME -n $NAMESPACE --timeout=120s || true
                  exit 1
                fi

          - name: Dump Logs
            if: failure()
            run: |
                kubectl describe deploy/$APP_NAME -n $NAMESPACE || true
                kubectl get pods -n $NAMESPACE -o wide
                for p in $(kubectl get pods -n $NAMESPACE -o name); do
                    echo "------- $p -------"
                    kubectl logs -n $NAMESPACE $p || true
                done

          - name: Rollback on failure
            if: failure()
            run: |
              echo "Failure has occured; Rolling back..."
              kubectl rollout undo deploy/$APP_NAME -n $NAMESPACE
              kubectl rollout status deploy/$APP_NAME -n $NAMESPACE --timeout=120s || true

          - name: Save Rendered Manifests
            uses: actions/upload-artifact@v4
            with:
                name: rendered-manifests
                path: /tmp/*.yml